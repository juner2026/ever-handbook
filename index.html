<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fdf4f7">
<title>Ever · 手帐</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="aset/pwa/icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#fdf4f7;color:#8a5a6a;
    font:16px/1.7 -apple-system,"Noto Sans SC",sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  .n{font:italic 400 38px/1.2 "Songti SC",Georgia,serif}
  .s{font-size:10px;letter-spacing:.42em;color:#c9a3ad;text-transform:uppercase}
  a{color:#b5738a;font-size:13px;margin-top:6px}
</style>
</head>
<body>
  <div class="n">Ever</div>
  <div class="s">Journal</div>
  <a href="app.html" id="go">正在进入手帐…</a>
<script>
/* 页面拆包以后，入口从 17MB 变成 3.5MB（压缩后约 1.1MB）——开屏能早得多开始。
   这里只是个几十字节的过门：纸色 + 一行字，立刻跳过去。 */
(function(){
  var t='ever.html';
  try{ if(location.search) t+=location.search; if(location.hash) t+=location.hash; }catch(e){}
  try{ document.getElementById('go').href=t; }catch(e){}
  try{ location.replace(t); }catch(e){}
})();
</script>
</body>
</html>

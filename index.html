<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fdf4f7">
<title>Ever · 手帐</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="aset/pwa/icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#fdf4f7;color:#8a5a6a;
    font:16px/1.7 -apple-system,"Noto Sans SC",sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  .n{font:italic 400 38px/1.2 "Songti SC",Georgia,serif}
  .s{font-size:10px;letter-spacing:.42em;color:#c9a3ad;text-transform:uppercase}
  a{color:#b5738a;font-size:13px;margin-top:6px}
</style>
</head>
<body>
  <div class="n">Ever</div>
  <div class="s">Journal</div>
  <a href="ever.html" id="go">正在进入手帐…</a>
<script>
/* ★ 8.65：不再注册 service worker —— 它缓存 17MB 单文件页面会写出截断内容，
   直接导致白屏。页面交给浏览器 HTTP 缓存；想彻底清干净就打开 /repair.html 。 */

/* ★ 8.62 · 全部收口到 ever.html 这一套。
   之前同时存在 ever.html（单文件）和 app.html+doc.html+js（拆包），
   index 指向谁都要改，一改就互相覆盖，还踩过"缓存键合并→跳转页自循环→白屏"。
   现在只有一套：/ → 这个 1.3KB 的过门页 → ever.html。 */
(function(){
  var t='ever.html';
  try{ if(location.search) t+=location.search; if(location.hash) t+=location.hash; }catch(e){}
  try{ document.getElementById('go').href=t; }catch(e){}
  try{ location.replace(t); }catch(e){}
})();
</script>
</body>
</html>
